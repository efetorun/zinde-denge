<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zinde &amp; Denge — Antrenman &amp; Beslenme</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F6F5E">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --shell-bg:#F5F6F3;
    --shell-ink:#232823;
    --shell-ink-soft:#6B6F68;
    --shell-border:#E4E5E0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--shell-bg);
    color:var(--shell-ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #shell{max-width:560px;margin:0 auto;padding:16px 16px 0;}
  .switcher{display:flex;gap:8px;}
  .switcher button{
    flex:1;
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-family:inherit;
    cursor:pointer;
    border:1px solid var(--shell-border);
    border-radius:14px;
    background:#fff;
    color:var(--shell-ink-soft);
    font-size:14px;
    font-weight:700;
    padding:12px 10px;
  }
  .switcher button.active.zinde{background:#C44F20;color:#fff;border-color:#C44F20;}
  .switcher button.active.denge{background:#2F6F5E;color:#fff;border-color:#2F6F5E;}
  .lang-switcher{display:flex;gap:6px;justify-content:center;margin-top:10px;}
  .lang-switcher button{
    font-family:inherit;cursor:pointer;
    border:1px solid var(--shell-border);
    border-radius:99px;
    background:#fff;
    color:var(--shell-ink-soft);
    font-size:12px;
    font-weight:700;
    padding:5px 14px;
  }
  .lang-switcher button.active{background:var(--shell-ink);color:#fff;border-color:var(--shell-ink);}
  #app-zinde, #app-denge{max-width:560px;margin:0 auto;padding:20px 16px 80px;}
  .loading{text-align:center;padding:60px 0;color:var(--shell-ink-soft);font-size:14px;}
  .footer-credit{text-align:center;font-size:11px;color:var(--shell-ink-soft);padding:10px 0 20px;}

  /* ============ ZINDE (Antrenman) tema ============ */
  #app-zinde{
    --z-bg:#F5F6F3; --z-card:#FFFFFF; --z-border:#E4E5E0;
    --z-ink:#232823; --z-ink-soft:#6B6F68;
    --z-accent:#C44F20; --z-accent-soft:#FBE7DB;
    --z-good:#2F6F5E; --z-good-soft:#E4EFEA;
    --z-radius:16px;
  }
  #app-zinde .z-h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-0.01em;color:var(--z-ink);}
  #app-zinde .z-sub{color:var(--z-ink-soft);font-size:13px;margin-top:2px;}
  #app-zinde .z-card{background:var(--z-card);border:1px solid var(--z-border);border-radius:var(--z-radius);padding:18px;margin-top:14px;}
  #app-zinde .z-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  #app-zinde input{padding:9px 10px;border:1px solid var(--z-border);border-radius:10px;font-size:15px;background:#FCFCFB;color:var(--z-ink);font-family:inherit;}
  #app-zinde input:focus{outline:2px solid var(--z-accent);outline-offset:1px;}
  #app-zinde button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-size:14px;font-weight:600;padding:10px 14px;}
  #app-zinde .z-btn-primary{background:var(--z-accent);color:white;width:100%;margin-top:16px;}
  #app-zinde .z-tabbar{display:flex;gap:8px;margin-top:16px;}
  #app-zinde .z-tabbar button{flex:1;background:var(--z-card);border:1px solid var(--z-border);color:var(--z-ink-soft);}
  #app-zinde .z-tabbar button.active{background:var(--z-ink);color:white;border-color:var(--z-ink);}
  #app-zinde .z-gear{background:none;border:none;font-size:18px;cursor:pointer;color:var(--z-ink-soft);padding:6px;}
  #app-zinde .z-ring-wrap{display:flex;align-items:center;gap:18px;}
  #app-zinde .z-ring-nums{flex:1;}
  #app-zinde .z-big{font-size:28px;font-weight:800;letter-spacing:-0.02em;color:var(--z-ink);}
  #app-zinde .z-big-label{font-size:13px;color:var(--z-ink-soft);margin-top:2px;}
  #app-zinde .z-pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--z-accent-soft);color:var(--z-accent);margin-top:8px;}
  #app-zinde .z-pill.good{background:var(--z-good-soft);color:var(--z-good);}
  #app-zinde .z-ex-card{background:var(--z-card);border:1px solid var(--z-border);border-radius:var(--z-radius);padding:16px;margin-top:12px;}
  #app-zinde .z-ex-top{display:flex;align-items:center;gap:10px;}
  #app-zinde .z-ex-emoji{font-size:24px;}
  #app-zinde .z-ex-name{font-weight:700;font-size:15px;color:var(--z-ink);}
  #app-zinde .z-ex-target{font-size:12px;color:var(--z-ink-soft);margin-top:1px;}
  #app-zinde .z-ex-bar-track{height:8px;border-radius:99px;background:var(--z-border);margin-top:12px;overflow:hidden;}
  #app-zinde .z-ex-bar-fill{height:100%;border-radius:99px;background:var(--z-accent);transition:width .2s ease;}
  #app-zinde .z-ex-bar-fill.done{background:var(--z-good);}
  #app-zinde .z-ex-controls{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:14px;}
  #app-zinde .z-ex-count-input{
    font-size:24px;font-weight:800;width:92px;text-align:center;color:var(--z-ink);
    border:1px solid var(--z-border);border-radius:10px;background:var(--z-bg);
    font-family:inherit;padding:6px 4px;-moz-appearance:textfield;cursor:text;
  }
  #app-zinde .z-ex-count-input::-webkit-outer-spin-button,
  #app-zinde .z-ex-count-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  #app-zinde .z-ex-count-input:focus{outline:2px solid var(--z-accent);outline-offset:1px;border-color:var(--z-accent);background:#fff;}
  #app-zinde .z-count-hint{
    text-align:center;font-size:11px;color:var(--z-ink-soft);margin-top:6px;
  }
  #app-zinde .z-ex-btn{width:44px;height:44px;border-radius:50%;background:var(--z-bg);border:1px solid var(--z-border);font-size:20px;font-weight:700;color:var(--z-ink);display:flex;align-items:center;justify-content:center;line-height:1;}
  #app-zinde .z-ex-btn:active{background:var(--z-accent-soft);}
  #app-zinde .z-ex-btn.minus{color:var(--z-ink-soft);}
  #app-zinde .z-how-toggle{display:block;width:100%;background:none;border:none;color:var(--z-accent);font-size:13px;font-weight:600;text-align:center;padding:12px 0 0;cursor:pointer;}
  #app-zinde .z-how-box{margin-top:10px;background:var(--z-bg);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;color:var(--z-ink-soft);}
  #app-zinde .z-goal-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--z-border);}
  #app-zinde .z-goal-row:last-child{border-bottom:none;}
  #app-zinde .z-goal-row .z-ex-emoji{width:28px;}
  #app-zinde .z-goal-name{flex:1;font-size:14px;font-weight:600;color:var(--z-ink);}
  #app-zinde .z-goal-row input{width:70px;text-align:center;}
  #app-zinde .z-hist-item{background:var(--z-card);border:1px solid var(--z-border);border-radius:var(--z-radius);padding:14px 16px;margin-top:10px;cursor:pointer;}
  #app-zinde .z-hist-head{display:flex;align-items:center;justify-content:space-between;}
  #app-zinde .z-hist-date{font-weight:700;font-size:14px;color:var(--z-ink);}
  #app-zinde .z-hist-pct{font-size:13px;font-weight:700;}
  #app-zinde .z-hist-detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--z-border);}
  #app-zinde .z-hist-line{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--z-ink-soft);}
  #app-zinde .z-hist-line b{color:var(--z-ink);font-weight:600;}
  #app-zinde .z-empty{color:var(--z-ink-soft);font-size:13px;padding:8px 0;text-align:center;}
  #app-zinde .z-disclaimer{font-size:12px;color:var(--z-ink-soft);text-align:center;margin-top:24px;line-height:1.6;}

  /* ============ DENGE (Beslenme) tema ============ */
  #app-denge{
    --d-bg:#F5F6F3; --d-card:#FFFFFF; --d-border:#E4E5E0;
    --d-ink:#232D28; --d-ink-soft:#65726B;
    --d-accent:#2F6F5E; --d-accent-soft:#E4EFEA;
    --d-warn:#B8793A; --d-warn-soft:#F6EAD9;
    --d-radius:16px;
  }
  #app-denge .d-h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-0.01em;color:var(--d-ink);}
  #app-denge .d-sub{color:var(--d-ink-soft);font-size:13px;margin-top:2px;}
  #app-denge .d-card{background:var(--d-card);border:1px solid var(--d-border);border-radius:var(--d-radius);padding:20px;margin-top:14px;}
  #app-denge .d-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  #app-denge label{display:block;font-size:13px;color:var(--d-ink-soft);margin-bottom:5px;margin-top:14px;}
  #app-denge label:first-child{margin-top:0;}
  #app-denge input,#app-denge select{width:100%;padding:11px 12px;border:1px solid var(--d-border);border-radius:10px;font-size:15px;background:#FCFCFB;color:var(--d-ink);font-family:inherit;}
  #app-denge input:focus,#app-denge select:focus{outline:2px solid var(--d-accent);outline-offset:1px;}
  #app-denge button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-size:14px;font-weight:600;padding:12px 16px;}
  #app-denge .d-btn-primary{background:var(--d-accent);color:white;width:100%;margin-top:18px;}
  #app-denge .d-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  #app-denge .d-ring-wrap{display:flex;align-items:center;gap:18px;}
  #app-denge .d-ring-nums{flex:1;}
  #app-denge .d-kcal-big{font-size:30px;font-weight:800;letter-spacing:-0.02em;color:var(--d-ink);}
  #app-denge .d-kcal-label{font-size:13px;color:var(--d-ink-soft);margin-top:2px;}
  #app-denge .d-pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--d-accent-soft);color:var(--d-accent);margin-top:8px;}
  #app-denge .d-pill.warn{background:var(--d-warn-soft);color:var(--d-warn);}
  #app-denge .d-note{font-size:13px;color:var(--d-ink-soft);background:#F8F7F3;border-radius:10px;padding:10px 12px;margin-top:12px;line-height:1.5;}
  #app-denge .d-note.warn{background:var(--d-warn-soft);color:#8A5A26;}
  #app-denge .d-entry-list{margin-top:14px;}
  #app-denge .d-entry{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--d-border);font-size:14px;color:var(--d-ink);}
  #app-denge .d-entry:last-child{border-bottom:none;}
  #app-denge .d-entry-del{background:none;border:none;color:var(--d-ink-soft);font-size:16px;cursor:pointer;padding:2px 6px;}
  #app-denge .d-section-title{font-size:14px;font-weight:700;margin-bottom:2px;color:var(--d-ink);}
  #app-denge .d-empty{color:var(--d-ink-soft);font-size:13px;padding:8px 0;}
  #app-denge .d-tabbar{display:flex;gap:8px;margin-top:16px;}
  #app-denge .d-tabbar button{flex:1;background:var(--d-card);border:1px solid var(--d-border);color:var(--d-ink-soft);}
  #app-denge .d-tabbar button.active{background:var(--d-ink);color:white;border-color:var(--d-ink);}
  #app-denge .d-tips li{margin-bottom:8px;line-height:1.5;font-size:14px;color:var(--d-ink);}
  #app-denge .d-tips{margin:10px 0 0;padding-left:18px;}
  #app-denge .d-disclaimer{font-size:12px;color:var(--d-ink-soft);text-align:center;margin-top:24px;line-height:1.6;}
  #app-denge .d-gear{background:none;border:none;font-size:18px;cursor:pointer;color:var(--d-ink-soft);padding:6px;}
  #app-denge .d-lang-pills{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  #app-denge .d-lang-pills button{padding:5px 12px;font-size:12px;border-radius:99px;background:var(--d-bg);border:1px solid var(--d-border);color:var(--d-ink-soft);}
  #app-denge .d-lang-pills button.active{background:var(--d-accent);color:#fff;border-color:var(--d-accent);}
  #app-denge .d-lang-note{font-size:11px;color:var(--d-ink-soft);margin-left:2px;}
  #app-denge .d-suggestions{
    display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);
    background:var(--d-card);border:1px solid var(--d-border);border-radius:10px;
    max-height:220px;overflow-y:auto;z-index:20;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
  }
  #app-denge .d-sugg-item{padding:9px 12px;font-size:13px;color:var(--d-ink);cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--d-border);}
  #app-denge .d-sugg-item:last-child{border-bottom:none;}
  #app-denge .d-sugg-item:hover{background:var(--d-accent-soft);}
  #app-denge .d-sugg-kcal{color:var(--d-ink-soft);white-space:nowrap;}
</style>
</head>
<body>
<div id="shell">
  <div class="switcher">
    <button id="switch-zinde" class="zinde">🏋️ <span id="switch-zinde-label">Antrenman</span></button>
    <button id="switch-denge" class="denge">🍽️ <span id="switch-denge-label">Beslenme</span></button>
  </div>
  <div class="lang-switcher">
    <button id="applang-tr" data-applang="tr">TR</button>
    <button id="applang-en" data-applang="en">EN</button>
    <button id="applang-de" data-applang="de">DE</button>
  </div>
</div>
<div id="app-zinde" style="display:none;"><div class="loading">Yükleniyor…</div></div>
<div id="app-denge" style="display:none;"><div class="loading">Yükleniyor…</div></div>
<div class="footer-credit">Provided by Efe Torun</div>

<script src="foods.js"></script>
<script src="zinde.js"></script>
<script src="denge.js"></script>
<script>
  const SHELL_KEY = 'zinde-denge-active-app';
  const APP_LANG_KEY = 'app-lang-v1';
  const SWITCH_LABELS = {
    tr: { antrenman:'Antrenman', beslenme:'Beslenme' },
    en: { antrenman:'Training', beslenme:'Nutrition' },
    de: { antrenman:'Training', beslenme:'Ernährung' },
  };

  let activeApp = localStorage.getItem(SHELL_KEY) || 'zinde';
  let appLang = localStorage.getItem(APP_LANG_KEY) || 'tr';
  let zindeInstance = null, dengeInstance = null;

  function applySwitchLabels(){
    const l = SWITCH_LABELS[appLang] || SWITCH_LABELS.tr;
    document.getElementById('switch-zinde-label').textContent = l.antrenman;
    document.getElementById('switch-denge-label').textContent = l.beslenme;
    document.querySelectorAll('.lang-switcher button').forEach(b => {
      b.classList.toggle('active', b.dataset.applang === appLang);
    });
  }

  function showApp(name){
    activeApp = name;
    try{ localStorage.setItem(SHELL_KEY, name); }catch(e){}
    document.getElementById('app-zinde').style.display = name === 'zinde' ? 'block' : 'none';
    document.getElementById('app-denge').style.display = name === 'denge' ? 'block' : 'none';
    document.getElementById('switch-zinde').classList.toggle('active', name === 'zinde');
    document.getElementById('switch-denge').classList.toggle('active', name === 'denge');
    if(name === 'zinde' && !zindeInstance){ zindeInstance = window.ZindeApp.init('app-zinde'); }
    if(name === 'denge' && !dengeInstance){ dengeInstance = window.DengeApp.init('app-denge'); }
  }

  function setAppLang(l){
    appLang = l;
    try{ localStorage.setItem(APP_LANG_KEY, l); }catch(e){}
    applySwitchLabels();
    if(zindeInstance) zindeInstance.setLang(l);
    if(dengeInstance) dengeInstance.setLang(l);
  }

  document.getElementById('switch-zinde').onclick = () => showApp('zinde');
  document.getElementById('switch-denge').onclick = () => showApp('denge');
  document.querySelectorAll('.lang-switcher button').forEach(b => {
    b.onclick = () => setAppLang(b.dataset.applang);
  });

  applySwitchLabels();
  showApp(activeApp);

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
